services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: perfectalone375/aerospace-ops-gateway:latest
    container_name: aerospace-mission-gateway
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - aero-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  aero-mesh:
    driver: bridge
